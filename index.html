<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Seed Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(34,197,94,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,197,94,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 540px;
    padding: 40px 36px;
    background: #111;
    border: 2px solid #22c55e;
    box-shadow: 0 0 40px rgba(34,197,94,0.15), inset 0 0 60px rgba(0,0,0,0.5);
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    color: #22c55e;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(34,197,94,0.6);
    letter-spacing: 1px;
  }

  .subtitle {
    color: #444;
    font-size: 11px;
    margin-bottom: 32px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  label {
    display: block;
    color: #22c55e;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #22c55e44;
    color: #e2e8f0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }

  input:focus {
    border-color: #22c55e;
    box-shadow: 0 0 16px rgba(34,197,94,0.2);
  }

  input::placeholder { color: #333; }

  button {
    width: 100%;
    background: #22c55e;
    color: #000;
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 16px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.15s, box-shadow 0.15s;
    margin-bottom: 28px;
  }

  button:hover {
    background: #4ade80;
    box-shadow: 0 0 24px rgba(34,197,94,0.5);
  }

  button:active { background: #16a34a; }

  .result-box {
    border: 1px solid #22c55e22;
    padding: 20px;
    background: #0a0a0a;
    min-height: 80px;
    transition: all 0.3s;
  }

  .result-label {
    color: #444;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .result-number {
    color: #22c55e;
    font-size: 22px;
    word-break: break-all;
    text-shadow: 0 0 16px rgba(34,197,94,0.5);
    transition: all 0.3s;
    min-height: 30px;
  }

  .result-number.pop {
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.95); opacity: 0.5; }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 1; }
  }

  .formula-note {
    margin-top: 20px;
    color: #2a2a2a;
    font-size: 10px;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  .corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: #22c55e;
    border-style: solid;
  }
  .corner.tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .corner.tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <h1>SEED<br>CONVERTER</h1>
  <p class="subtitle">Java Edition · hashCode()</p>

  <label>Enter Seed Text</label>
  <input type="text" id="seedInput" placeholder="e.g. Xk9#mP2vQw5!nL8j..." oninput="convert()" />

  <button onclick="convert()">▶ CONVERT</button>

  <div class="result-box">
    <div class="result-label">Minecraft Seed Number</div>
    <div class="result-number" id="output">—</div>
  </div>

  <p class="formula-note">formula: h = (h × 31) + ascii(char) → clamped to 64-bit int</p>
</div>

<script>
  function javaHashCode(str) {
    let hash = BigInt(0);
    const MOD = BigInt(2) ** BigInt(64);
    const HALF = BigInt(2) ** BigInt(63);

    for (let i = 0; i < str.length; i++) {
      hash = (hash * BigInt(31) + BigInt(str.charCodeAt(i))) % MOD;
    }

    // Convert to signed 64-bit
    if (hash >= HALF) hash -= MOD;
    return hash.toString();
  }

  function convert() {
    const val = document.getElementById('seedInput').value;
    const out = document.getElementById('output');

    if (!val) {
      out.textContent = '—';
      return;
    }

    const result = javaHashCode(val);
    out.textContent = result;
    out.classList.remove('pop');
    void out.offsetWidth;
    out.classList.add('pop');
  }
</script>
</body>
</html>
